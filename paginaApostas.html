<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Apostas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>

        <!-- TÍTULO DA PÁGINA -->
        <h1>Página de Apostas</h1>

        <!----------------------------------------------------------------------->

        <!-- SEÇÃO DE SELEÇÃO DE TIMES -->


        <!-- Botões para selecionar os times -->
        <section id="times">
            <button id="time1" class="botaoTime">Brasil</button>
            <p>VS</p>
            <button id="time2" class="botaoTime">Japão</button>
        </section>

        <!-- Status da seleção -->
        <p id="status">status</p>


        <!----------------------------------------------------------------------->

        <!-- SEÇÃO DE ESCOLHA DE APOSTAS -->


        <!-- Controles do valor da aposta -->
        <section id="apostas">

            <!-- Esse é o lucro caso ganhe -->
            <p id="ganho">Possível ganho: $0,00</p>

            <!-- Input para o valor da aposta -->
            <input id="valorAposta" type="number" step="50" placeholder="Quanto apostará no time?">

            <!-- Botão para realizar a aposta -->
            <button id="apostar">Apostar</button>

            <!-- Aviso caso haja algo inválido -->
            <p id="aviso">aviso</p>
        </section>


        <!----------------------------------------------------------------------->

        <!-- SEÇÃO DE RESULTADO DA APOSTA NO PLACAR -->


        <!-- Placar de resultados -->
        <div id="placar">

            <section style="display: flex; gap: 10px; align-items: center;">
                <!-- Essa seção mostra o resultado do time 1 -->
                <section>
                    <p id="placar-time1" class="placar-time">0</p>
                    <p id="nome-time1" class="nome-time">Brasil</p>
                </section>

                <p>VS</p>

                <!-- Essa seção mostra o resultado do time 2 -->
                <section>
                    <p id="placar-time2" class="placar-time">0</p>
                    <p id="nome-time2" class="nome-time">Japão</p>
                </section>
            </section>

            <!-- Resultado da sua aposta -->
            <p id="resultado">Resultado</p>
        </div>

    </main>



    <footer>
        <a href="index.html">Voltar para a página inicial</a>

        <!-- Saldo disponível -->
        <p id="saldo">Saldo: <span id="saldo-valor">$ 1.500,00</span></p>
    </footer>

</body>
</html>
